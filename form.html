<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edumax - Announcement</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
    <style>
        .header-logo {
            min-height: 140px;
            position: relative;
            z-index: 2;
        }

        .header-logo h1 {
            background-color: #084298;
        }

        .btn-primary {
            --bs-btn-color: #fff;
            --bs-btn-bg: #084298;
            --bs-btn-border-color: #084298;
            --bs-btn-hover-color: #fff;
            --bs-btn-hover-bg: #06357a;
            --bs-btn-hover-border-color: #06357a;
            --bs-btn-active-color: #fff;
            --bs-btn-active-bg: #052c65;
            --bs-btn-active-border-color: #052c65;
        }

        .header-actions {
            min-width: 0;
            min-height: 140px;
            flex: 1 1 auto;
        }

        .header-bottom {
            max-width: 100%;
            min-width: 0;
        }

        .header-bottom form {
            flex: 0 1 260px;
            min-width: 150px;
            max-width: 260px;
        }

        .header-bottom .navbar-collapse {
            flex: 0 1 auto;
            min-width: 0;
            justify-content: center;
        }

        .header-bottom .navbar-nav {
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            margin-left: auto;
            margin-right: auto;
            white-space: nowrap;
        }

        .header-bottom .navbar-nav > .nav-item.has-separator {
            position: relative;
            padding-right: 0.75rem;
        }

        .header-bottom .navbar-nav > .nav-item.has-separator::after {
            content: " |";
            color: #fff;
            text-decoration: none;
            position: absolute;
            top: 50%;
            right: 0;
            line-height: 1;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .dropdown-menu {
            color: #212529;
            background-color: #fff;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 2px;
            box-shadow: 0 0 0 5px #212529;
        }

        /* Desktop dropdown */
        .news-dropdown .dropdown-menu {
            display: none;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            left: 50% !important;
            transform: translateX(-50%);
            margin-top: 0.5rem;
            padding-top: 0.75rem;
            padding-bottom: 0.5rem;
        }

        .news-dropdown .dropdown-menu.show {
            display: flex;
        }

        .news-dropdown .dropdown-item {
            display: inline;
            padding: 0.25rem 0.5rem;
            vertical-align: middle;
        }

        .news-dropdown .dropdown-item + .dropdown-item::before {
            content: " | ";
            color: #495057;
            vertical-align: middle;
        }

        @media (max-width: 991.98px) {
            .header-logo {
                min-height: 0;
            }

            .header-actions {
                width: 100%;
                min-height: 0;
                margin-top: 0;
            }

            .header-bottom {
                width: 100%;
                flex-wrap: wrap;
                align-items: center;
                row-gap: 0.5rem;
                margin-top: 0.5rem !important;
            }

            .header-bottom .navbar-toggler {
                order: 1;
                flex: 0 0 auto;
            }

            .header-bottom form {
                order: 2;
                flex: 1 1 0%;
                min-width: 0;
                width: auto;
                max-width: none;
                margin-left: 0.5rem;
            }

            .header-bottom .navbar-collapse {
                flex: 1 1 100%;
                flex-basis: 100%;
                width: 100%;
                order: 3;
                justify-content: flex-start;
            }

            .header-bottom .navbar-nav {
                flex-direction: column;
                flex-wrap: nowrap;
                align-items: flex-start;
                width: 100%;
                margin-left: 0;
                margin-right: 0;
                white-space: normal;
            }

            .header-bottom .navbar-nav > .nav-item.has-separator::after {
                display: none;
            }

            .header-bottom .navbar-nav > .nav-item.has-separator {
                padding-right: 0;
            }

            /* Mobile dropdown overrides */
            .news-dropdown .dropdown-menu {
                display: none;
                flex-direction: column;
                align-items: flex-start;
                left: 0 !important;
                transform: none;
            }

            .news-dropdown .dropdown-menu.show {
                display: flex;
            }

            .news-dropdown .dropdown-item + .dropdown-item::before {
                content: "";
            }
        }

        @media (max-width: 575.98px) {
            .header-logo h1 {
                font-size: 3rem !important;
            }

            .header-logo img {
                width: 105px !important;
            }

            .header-bottom form {
                flex: 1 1 0%;
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="p-3" style="background-color: #084298;">
        <nav class="navbar navbar-expand-lg navbar-dark p-0" aria-label="Primary navigation">
            <div class="container-fluid flex-wrap align-items-start p-0">

                <!-- Logo and title -->
                <div class="header-logo d-flex align-items-start flex-shrink-0">
                    <a href="./index.html" aria-label="EduMax home">
                        <img src="./images/EduMax_logo.png" alt="EduMax logo"
                            style="width: 140px; height: auto;">
                    </a>
                    <h1 class="p-2 mt-0 text-white text-nowrap"
                        style="font-size: 4.2rem; line-height: 0.75;">
                        EduMax
                    </h1>
                </div>

                <div class="header-actions ms-auto d-flex flex-column align-items-end mt-2 me-4">
                    <a class="btn btn-light btn-sm px-2 d-none d-lg-inline-block"
                        href="./pages/registration.html" role="button"
                        style="width: 65px; height: 24px; line-height: 20px; padding: 0; text-align: center;">
                        Logout
                    </a>

                    <div class="header-bottom d-flex align-items-start mt-auto w-100">
                        <button class="navbar-toggler ms-0" type="button"
                            data-bs-toggle="collapse" data-bs-target="#navLinks"
                            aria-controls="navLinks" aria-expanded="false"
                            aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon" aria-hidden="true" tabindex="-1"></span>
                        </button>

                        <div class="collapse navbar-collapse" id="navLinks">
                            <ul class="navbar-nav flex-lg-row align-items-lg-end justify-content-center">
                                <li class="nav-item dropdown news-dropdown has-separator">
                                    <a class="nav-link dropdown-toggle text-white text-decoration-underline text-nowrap px-2"
                                        href="#" role="button" data-bs-toggle="dropdown"
                                        aria-expanded="false"
                                        aria-haspopup="true">News</a>
                                    <ul class="dropdown-menu">
                                        <li><a class="dropdown-item" href="#">Events</a></li>
                                        <li><a class="dropdown-item" href="#">Announcements</a></li>
                                    </ul>
                                </li>
                                <li class="nav-item has-separator">
                                    <a class="nav-link text-white text-decoration-underline text-nowrap px-2" href="#">
                                        Catalogue
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link text-white text-decoration-underline text-nowrap px-2" href="#">
                                        Security
                                    </a>
                                </li>
                                <li class="nav-item d-lg-none">
                                    <a class="nav-link text-white text-decoration-underline text-nowrap px-2"
                                        href="./pages/registration.html">
                                        Logout
                                    </a>
                                </li>
                            </ul>
                        </div>

                        <form class="d-flex ms-3 mt-2" role="search" aria-label="Site search">
                            <div class="position-relative w-100">
                                <button class="btn position-absolute top-50 translate-middle-y text-dark"
                                    type="submit" aria-label="Submit search"
                                    style="left: 0; width: 24px; height: 24px; padding: 0; border: none; background: transparent;">
                                    <i class="bi bi-search" aria-hidden="true" tabindex="-1"></i>
                                </button>
                                <input class="form-control" type="search" id="searchInput"
                                    name="search"
                                    aria-label="Search"
                                    placeholder="search"
                                    style="font-size: 1rem; height: 23px; padding: 2px 8px 2px 22px;">
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </nav>
        </header>

        <main>
            <form
                aria-label="Create announcement"
                action="https://students.open.ac.uk/mct/tm252/reflect/reflect.php"
                method="post"
                enctype="multipart/form-data">

            <input
                type="hidden"
                name="item_ID"
                value="30001000-5000-654321fedcba">
            <input type="hidden" name="csrf_token" value="">   
            
                <div class="mb-3">
                <label for="content" class="form-label"><strong>Content:</strong></label>
                <textarea
                    class="form-control"
                    id="content"
                    name="content"
                    rows="5"
                    placeholder="plain text"></textarea>
            </div>
            <div class="mb-3">
                <label for="subject" class="form-label"><strong>Subject line:</strong></label>
                <input
                    type="text"
                    class="form-control"
                    id="subject"
                    name="subject"
                    placeholder="e.g. Exams revision timetable (maximum five words)">
            </div>
            <div class="mb-3">
                <label for="senderName" class="form-label"><strong>Sender's name:</strong></label>
                <input
                    type="text"
                    class="form-control"
                    id="senderName"
                    name="sender_name"
                    placeholder="e.g. Safa Smith">
            </div>
            <div class="mb-3">
                <label for="senderRole" class="form-label">
                    <strong>Sender's role (module lead, administrator, module assistant):</strong>
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="senderRole"
                    name="sender_role"
                    placeholder="e.g. module lead">
            </div>
            <div class="mb-3">
                <label for="attachment" class="form-label">
                    <strong>Attachment (optional):</strong>
                </label>
                <input
                    type="file"
                    class="form-control"
                    id="attachment"
                    name="attachment">
            </div>
            <div class="mb-3">
                <label for="sendDateTime" class="form-label">
                    <strong>Date and time that the email should be sent:</strong>
                </label>
                <input
                    type="datetime-local"
                    class="form-control"
                    id="sendDateTime"
                    name="send_datetime"
                    value="2024-10-01T09:00">
            </div>
            <div class="mb-3">
                <label for="priority" class="form-label"><strong>Priority (High/Normal/Low):</strong></label>
                <select
                    class="form-select"
                    id="priority"
                    name="priority">
                    <option value="High" selected>High</option>
                    <option value="Normal">Normal</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">
                Submit
            </button>

            </form>
        </main>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
